```
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Coming Soon — Computer Game Development</title>

<meta
  name="description"
  content="ผลงาน Computer Game Development — อยู่ระหว่างการพัฒนา"
/>

<meta name="theme-color" content="#05060f" />

<style>

@font-face{
  font-family:'LINE Seed Sans TH';
  src:url('https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/LINESeedSansTH/LINESeedSansTH-Regular.woff2') format('woff2');
  font-weight:400;
  font-display:swap;
}

@font-face{
  font-family:'LINE Seed Sans TH';
  src:url('https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/LINESeedSansTH/LINESeedSansTH-Bold.woff2') format('woff2');
  font-weight:700;
  font-display:swap;
}

*{
  margin:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;

  background:#05060f;
  color:#e2e8f0;

  font-family:'LINE Seed Sans TH',system-ui,sans-serif;
  text-align:center;

  padding:24px;
  overflow:hidden;
}

/* =========================
   BACKGROUND GLOW
   ========================= */

body::before,
body::after{
  content:'';
  position:fixed;
  pointer-events:none;
  border-radius:999px;
  filter:blur(120px);
  z-index:-2;
}

body::before{
  width:420px;
  height:420px;

  left:-180px;
  top:20%;

  background:rgba(99,102,241,.13);

  animation:glowLeft 12s ease-in-out infinite;
}

body::after{
  width:420px;
  height:420px;

  right:-180px;
  bottom:10%;

  background:rgba(192,38,211,.12);

  animation:glowRight 14s ease-in-out infinite;
}

@keyframes glowLeft{

  0%,100%{
    transform:translate(0,0) scale(1);
  }

  50%{
    transform:translate(80px,-30px) scale(1.15);
  }

}

@keyframes glowRight{

  0%,100%{
    transform:translate(0,0) scale(1);
  }

  50%{
    transform:translate(-70px,30px) scale(.9);
  }

}

/* =========================
   GRID BACKGROUND
   ========================= */

.grid{
  position:fixed;
  inset:0;

  pointer-events:none;

  background-image:
    linear-gradient(
      rgba(99,102,241,.07) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(99,102,241,.07) 1px,
      transparent 1px
    );

  background-size:60px 60px;

  mask-image:
    radial-gradient(
      ellipse 70% 65% at 50% 50%,
      #000 20%,
      transparent 100%
    );

  -webkit-mask-image:
    radial-gradient(
      ellipse 70% 65% at 50% 50%,
      #000 20%,
      transparent 100%
    );

  animation:gridMove 7s linear infinite;

  z-index:-1;
}

@keyframes gridMove{

  from{
    background-position:0 0;
  }

  to{
    background-position:0 60px;
  }

}

/* =========================
   CONTENT
   ========================= */

.container{
  width:min(100%,520px);

  display:flex;
  flex-direction:column;
  align-items:center;
}

/* =========================
   ICON
   ========================= */

.icon{
  width:110px;
  height:110px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:64px;

  border-radius:32px;

  border:1px solid rgba(255,255,255,.12);

  background:
    linear-gradient(
      135deg,
      rgba(99,102,241,.16),
      rgba(192,38,211,.12),
      rgba(34,211,238,.10)
    );

  box-shadow:
    0 20px 60px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.08);

  backdrop-filter:blur(16px);

  animation:float 3s ease-in-out infinite;
}

@keyframes float{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-10px);
  }

}

/* =========================
   BADGE
   ========================= */

.badge{
  margin-top:28px;

  display:inline-flex;
  align-items:center;
  gap:8px;

  padding:8px 16px;

  border-radius:999px;

  border:1px solid rgba(129,140,248,.30);

  background:rgba(255,255,255,.05);

  color:#c7d2fe;

  font-size:13px;
  font-weight:700;

  backdrop-filter:blur(12px);
}

.badge-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#34d399;

  box-shadow:0 0 12px rgba(52,211,153,.7);

  animation:pulse 2s ease-in-out infinite;
}

@keyframes pulse{

  0%,100%{
    opacity:.6;
    transform:scale(1);
  }

  50%{
    opacity:1;
    transform:scale(1.25);
  }

}

/* =========================
   TITLE
   ========================= */

h1{
  margin-top:22px;

  font-size:42px;
  line-height:1.05;

  font-weight:700;

  background:
    linear-gradient(
      90deg,
      #a5b4fc,
      #f0abfc,
      #67e8f9,
      #a5b4fc
    );

  background-size:200% auto;

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  animation:hue 6s linear infinite;
}

@keyframes hue{

  to{
    background-position:200% center;
  }

}

/* =========================
   DESCRIPTION
   ========================= */

p{
  margin-top:14px;

  color:#94a3b8;

  font-size:15px;

  line-height:1.7;
}

.sub{
  margin-top:4px;

  color:#64748b;

  font-size:12px;

  font-family:monospace;

  letter-spacing:.12em;
}

/* =========================
   BUTTON
   ========================= */

a{
  margin-top:28px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  text-decoration:none;

  color:#fff;

  font-weight:700;
  font-size:14px;

  border:1px solid rgba(255,255,255,.15);

  background:
    linear-gradient(
      135deg,
      rgba(99,102,241,.18),
      rgba(192,38,211,.14)
    );

  padding:12px 22px;

  border-radius:999px;

  backdrop-filter:blur(12px);

  box-shadow:
    0 10px 30px rgba(0,0,0,.25);

  transition:
    transform .25s ease,
    background .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

a:hover{

  transform:translateY(-3px);

  background:
    linear-gradient(
      135deg,
      rgba(99,102,241,.30),
      rgba(192,38,211,.25)
    );

  border-color:rgba(165,180,252,.35);

  box-shadow:
    0 14px 35px rgba(79,70,229,.20);
}

a:active{
  transform:translateY(0) scale(.97);
}

/* =========================
   MOBILE
   ========================= */

@media(max-width:640px){

  .icon{
    width:90px;
    height:90px;

    font-size:52px;

    border-radius:26px;
  }

  h1{
    font-size:34px;
  }

  p{
    font-size:14px;
  }

}

/* =========================
   REDUCED MOTION
   ========================= */

@media(prefers-reduced-motion:reduce){

  *{
    animation:none!important;
  }

}

</style>
</head>

<body>

<div class="grid"></div>

<div class="container">

  <div class="icon">
    🚧
  </div>

  <div class="badge">

    <span class="badge-dot"></span>

    GAME DEV LAB

  </div>

  <h1>
    Coming Soon
  </h1>

  <p>
    อยู่ระหว่างพัฒนา — โปรดติดตามเร็วๆ นี้
  </p>

  <p class="sub">
    COMPUTER GAME DEVELOPMENT
  </p>

  <a href="../index.html">
    ← กลับหน้าหลัก
  </a>

</div>

</body>
</html>
```
